<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TransitOps — Smart Transport Operations Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-2: #171b21;
    --border: #262b33;
    --border-soft: #1d2129;
    --text: #e7e9ec;
    --text-dim: #9aa2ad;
    --text-faint: #5b636e;
    --accent: #e08a2c;
    --accent-2: #f2a83e;
    --accent-dim: #3a2c17;
    --green: #3ecf8e;
    --green-bg: #123024;
    --blue: #4d9fec;
    --blue-bg: #10202f;
    --orange: #e0a52c;
    --orange-bg: #2f2410;
    --red: #ef5b6b;
    --red-bg: #301418;
    --radius: 10px;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg: #f3f2ee;
    --panel: #ffffff;
    --panel-2: #f8f7f4;
    --border: #e2e0da;
    --border-soft: #ebe9e3;
    --text: #1c1d1f;
    --text-dim: #5c5f66;
    --text-faint: #9a9da4;
    --accent: #c96a1c;
    --accent-2: #de8330;
    --accent-dim: #f6e3cc;
    --green: #1f9d63;
    --green-bg: #e4f6ee;
    --blue: #2f6fc9;
    --blue-bg: #e6eefb;
    --orange: #b6821e;
    --orange-bg: #faf0dd;
    --red: #c8394a;
    --red-bg: #fbe7e9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    display:flex; min-height:100vh;
  }
  .login-side{
    flex:1.1; background:linear-gradient(160deg,var(--panel-2),var(--bg));
    padding:56px 48px; display:flex; flex-direction:column; justify-content:space-between;
    border-right:1px solid var(--border);
  }
  .login-form-side{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .logo-mark{
    width:44px;height:44px;border-radius:10px;
    background:repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, var(--accent-2) 4px, var(--accent-2) 8px);
    margin-bottom:18px; box-shadow:var(--shadow);
  }
  .brand{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .tagline{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .roles-list{margin-top:40px;color:var(--text-dim);font-size:14px;line-height:2.1;}
  .roles-list b{color:var(--text);font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:10px;}
  .foot-note{color:var(--text-faint);font-size:11px;letter-spacing:.4px;text-transform:uppercase;}

  .login-card{width:100%;max-width:400px;}
  .login-card h2{font-size:22px;margin:0 0 4px;}
  .login-card p.sub{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;margin-top:16px;font-weight:600;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:inherit; outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input::placeholder{color:var(--text-faint);}
  .row-inline{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--text-dim);}
  .row-inline a{color:var(--accent-2);text-decoration:none;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent); color:#1a1206; border:none; font-weight:700;
    padding:12px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;
    transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn.full{width:100%;margin-top:22px;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-weight:600;padding:8px 12px;font-size:12.5px;}
  .btn.danger{background:var(--red);color:#2a0a0e;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
  .error-box{
    margin-top:14px;background:var(--red-bg);border:1px dashed var(--red);border-radius:8px;
    padding:12px 14px;font-size:12.5px;color:var(--red);line-height:1.7;
  }
  .hint{color:var(--text-faint);font-size:11.5px;margin-top:18px;line-height:1.6;border-top:1px dashed var(--border);padding-top:14px;}

  /* ---------- APP SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px; background:var(--panel); border-right:1px solid var(--border);
    padding:22px 14px; display:flex; flex-direction:column; flex-shrink:0;
  }
  .sidebar .brand{font-size:19px;margin-bottom:2px;padding-left:6px;}
  .sidebar .tagline{font-size:11px;padding-left:6px;margin-bottom:26px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;
  }
  .navitem:hover{background:var(--panel-2);color:var(--text);}
  .navitem.active{background:var(--accent-dim);color:var(--accent-2);border-color:var(--border);font-weight:700;}
  .navitem .ic{width:16px;text-align:center;}
  .navlock{font-size:9.5px;color:var(--text-faint);margin-left:auto;border:1px solid var(--border);padding:1px 5px;border-radius:20px;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:5;
  }
  .search-box{
    flex:1;max-width:340px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:9px 12px;color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:8px;
  }
  .search-box input{border:none;background:none;padding:0;font-size:13px;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .user-chip{font-size:13px;color:var(--text-dim);}
  .role-badge{
    background:var(--blue-bg);color:var(--blue);border:1px solid var(--border);
    padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#08131f;font-size:10px;
    font-weight:800;display:flex;align-items:center;justify-content:center;}
  .content{padding:24px 26px;overflow-y:auto;}
  .page-title{font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px;}
  .page-title .num{color:var(--text-faint);font-weight:500;}

  .kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px;}
  @media (max-width:1300px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
  .kpi{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;
    border-left:3px solid var(--blue);
  }
  .kpi.green{border-left-color:var(--green);}
  .kpi.orange{border-left-color:var(--orange);}
  .kpi label{margin:0 0 6px;font-size:10px;}
  .kpi .val{font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel-title{font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
  @media (max-width:1000px){.grid-2{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
    padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
  th:hover{color:var(--text-dim);}
  td{padding:10px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel-2);}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.Available{background:var(--green-bg);color:var(--green);}
  .badge.On.Trip, .badge.OnTrip{background:var(--blue-bg);color:var(--blue);}
  .badge.In.Shop, .badge.InShop{background:var(--orange-bg);color:var(--orange);}
  .badge.Retired,.badge.Suspended,.badge.Cancelled,.badge.EXPIRED{background:var(--red-bg);color:var(--red);}
  .badge.Off.Duty,.badge.OffDuty,.badge.Draft{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
  .badge.Dispatched{background:var(--blue-bg);color:var(--blue);}
  .badge.Completed,.badge.Active-ok{background:var(--green-bg);color:var(--green);}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select,.toolbar input{width:auto;min-width:120px;padding:8px 10px;font-size:12.5px;}
  .toolbar .spacer{flex:1;}
  .fieldset{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .fieldset .full{grid-column:1/-1;}
  .actions-cell{display:flex;gap:6px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
  .rule-note{font-size:11.5px;color:var(--accent-2);background:var(--accent-dim);border:1px dashed var(--accent);
    padding:9px 12px;border-radius:8px;margin-top:14px;}
  .bar-track{background:var(--panel-2);border-radius:6px;height:8px;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:6px;}
  .status-line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
  .status-line span.lbl{width:70px;flex-shrink:0;}
  .status-line span.n{width:26px;text-align:right;flex-shrink:0;color:var(--text);font-weight:600;}
  .toast{
    position:fixed;bottom:26px;right:26px;background:var(--panel);border:1px solid var(--border);
    border-left:3px solid var(--accent);padding:13px 18px;border-radius:8px;box-shadow:var(--shadow);
    font-size:13px;max-width:340px;z-index:999;animation:slidein .25s ease;
  }
  .toast.err{border-left-color:var(--red);}
  .toast.ok{border-left-color:var(--green);}
  @keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:420px;max-width:92vw;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 4px;font-size:16px;}
  .modal p.sub{color:var(--text-dim);font-size:12.5px;margin:0 0 18px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .chart-bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px;}
  .chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .chart-bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue),#2f6fc9);min-height:6px;}
  .chart-lbl{font-size:10.5px;color:var(--text-faint);}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
  .swatch{width:9px;height:9px;border-radius:2px;}
  .perm-table td, .perm-table th{text-align:center;}
  .perm-table td:first-child,.perm-table th:first-child{text-align:left;}
  .view-only-tag{font-size:11px;color:var(--text-faint);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
  .link-btn{background:none;border:none;color:var(--accent-2);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;}
  .link-btn:hover{text-decoration:underline;}
  .theme-toggle{background:var(--panel-2);border:1px solid var(--border);border-radius:20px;width:38px;height:22px;position:relative;cursor:pointer;}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:left .15s;}
  [data-theme="light"] .theme-toggle .knob{left:18px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  .banner{background:var(--orange-bg);border:1px solid var(--orange);color:var(--orange);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}

  /* ---------- RESPONSIVE ---------- */
  .hamburger{display:none;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;
    align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text);font-size:16px;}
  .sidebar-scrim{display:none;}
  th.sortable::after{content:'⇅';opacity:.35;margin-left:5px;font-size:10px;}
  th.sort-asc::after{content:'↑';opacity:1;margin-left:5px;font-size:10px;color:var(--accent-2);}
  th.sort-desc::after{content:'↓';opacity:1;margin-left:5px;font-size:10px;color:var(--accent-2);}

  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }

  @media (max-width:768px){
    .hamburger{display:flex;}
    .shell{position:relative;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:150; height:100vh;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-scrim.open{
      display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:140;
    }
    .topbar{padding:12px 14px;gap:10px;}
    .search-box{max-width:none;}
    .user-chip{display:none;}
    .content{padding:16px 14px;}
    .page-title{font-size:17px;margin-bottom:14px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;}
    .kpi{padding:11px 12px;}
    .kpi .val{font-size:18px;}
    .toolbar{gap:8px;}
    .toolbar select,.toolbar input{min-width:0;flex:1;}
    .fieldset{grid-template-columns:1fr;}
    .modal{width:100%;padding:18px;}
    .login-side{display:none;}
    .login-form-side{padding:20px;}
    .chart-bars{height:110px;}
    table{font-size:12px;}
    th,td{padding:8px 7px;}
    .role-badge span{display:none;}
    .role-badge{padding:5px 8px;}
  }

  @media (max-width:480px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .brand{font-size:17px;}
    .login-card h2{font-size:19px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar .spacer{display:none;}
    .toolbar button{width:100%;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions .btn{width:100%;}
  }

  /* ---------- NOTIFICATION CENTER ---------- */
  .bell-wrap{position:relative;}
  .bell-btn{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text);position:relative;
  }
  .bell-btn:hover{background:var(--panel);}
  .bell-badge{
    position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:800;
    min-width:16px;height:16px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 4px;
    border:2px solid var(--bg);
  }
  .notif-dropdown{
    position:absolute;top:46px;right:0;width:340px;max-height:420px;overflow-y:auto;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:120;animation:slidein .15s ease;
  }
  .notif-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .notif-head b{font-size:13px;}
  .notif-item{padding:11px 14px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .1s;}
  .notif-item:hover{background:var(--panel-2);}
  .notif-item:last-child{border-bottom:none;}
  .notif-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
  .notif-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .notif-dot.danger{background:var(--red);}
  .notif-dot.warning{background:var(--orange);}
  .notif-dot.success{background:var(--green);}
  .notif-title{font-size:12.5px;font-weight:700;color:var(--text);}
  .notif-sub{font-size:11.5px;color:var(--text-dim);margin-left:15px;}
  .notif-prio{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;margin-left:auto;}
  .notif-prio.High{background:var(--red-bg);color:var(--red);}
  .notif-prio.Medium{background:var(--orange-bg);color:var(--orange);}
  .notif-prio.Low{background:var(--panel-2);color:var(--text-faint);border:1px solid var(--border);}
  .notif-empty{padding:30px 14px;text-align:center;color:var(--text-faint);font-size:12.5px;}
  .notif-foot{padding:9px 14px;text-align:center;border-top:1px solid var(--border);}

  /* ---------- DOCUMENTS ---------- */
  .doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .doc-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px;}
  .doc-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .doc-card-head b{font-size:12.5px;}
  .doc-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .doc-status.valid{background:var(--green-bg);color:var(--green);}
  .doc-status.soon{background:var(--orange-bg);color:var(--orange);}
  .doc-status.expired{background:var(--red-bg);color:var(--red);}
  .doc-status.none{background:var(--panel);color:var(--text-faint);border:1px solid var(--border);}
  .doc-meta{font-size:11px;color:var(--text-faint);margin-bottom:8px;}
  .doc-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .doc-actions .link-btn{font-size:11px;}
  .doc-count-pill{font-size:10.5px;color:var(--text-dim);border:1px solid var(--border);padding:2px 8px;border-radius:20px;margin-left:8px;}

  /* ---------- CHARTS ---------- */
  .chart-card{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:14px;}
  .chart-card canvas{max-height:220px;}
  .analytics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:18px;}
  @media (max-width:1000px){.analytics-grid{grid-template-columns:1fr;}}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0;}
  .gauge-val{font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-top:-56px;color:var(--text);}
  .gauge-lbl{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .kpi,.panel,.chart-card,.doc-card{animation:fadeUp .35s ease both;}
  .kpi:nth-child(2){animation-delay:.03s;} .kpi:nth-child(3){animation-delay:.06s;} .kpi:nth-child(4){animation-delay:.09s;}
  .kpi:nth-child(5){animation-delay:.12s;} .kpi:nth-child(6){animation-delay:.15s;} .kpi:nth-child(7){animation-delay:.18s;}
  .btn,.navitem,.link-btn,.doc-card,.notif-item{transition:all .15s ease;}
  .kpi:hover,.panel:hover,.chart-card:hover{border-color:var(--accent);}

  /* ---------- SKELETON LOADER ---------- */
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}
  .skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--border-soft) 37%,var(--panel-2) 63%);
    background-size:400px 100%;animation:shimmer 1.2s infinite linear;border-radius:6px;}
  .skel-row{height:14px;margin:10px 0;}
  .skel-kpi{height:70px;border-radius:var(--radius);}

  /* ---------- LOADING SPINNER ---------- */
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;
    animation:spin .6s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .btn.loading{opacity:.75;pointer-events:none;}

  /* ---------- EMPTY STATE ILLUSTRATION ---------- */
  .empty-state{padding:44px 20px;}
  .empty-illustration{font-size:34px;opacity:.35;margin-bottom:10px;}

  /* ---------- EMAIL PREVIEW ---------- */
  .email-preview{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;}
  .email-field{font-size:11.5px;color:var(--text-faint);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px;}
  .email-val{font-size:13px;color:var(--text);margin-bottom:10px;}
  .email-body{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-line;border-top:1px dashed var(--border);padding-top:10px;}
</style>
</head>
<body data-theme="dark">

<script>
/* =========================================================
   TransitOps — in-memory demo data layer + SPA renderer
   ========================================================= */

const TODAY = new Date('2026-07-12');

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,7).toUpperCase(); }
function fmtMoney(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function badgeClass(s){ return 'badge ' + String(s).replace(/\s+/g,'.'); }
function isExpired(dateStr){ return new Date(dateStr) < TODAY; }
function daysUntil(dateStr){ return Math.round((new Date(dateStr) - TODAY)/86400000); }

const RBAC = {
  'Fleet Manager':    {fleet:'edit', drivers:'edit', trips:'none', maintenance:'edit', fuel:'none', analytics:'edit'},

  'Financial Analyst':{fleet:'view', drivers:'none', trips:'none', maintenance:'none', fuel:'edit', analytics:'edit'},
};
const ROLE_INITIALS = {'Fleet Manager':'FM','Dispatcher':'DP','Safety Officer':'SO','Financial Analyst':'FA'};

const DOC_TYPES = ['RC','Insurance','Fitness Certificate','Pollution Certificate','Permit'];

        documents:{

      {id:'V4', regNo:'GJ01AB0081', name:'VAN-09', type:'Van', capacityKg:750, capacityLabel:'750 kg', odometer:24900, acqCost:590000, status:'Retired',
        documents:{

          'Insurance':{number:'INS-00812', expiry:'2025-12-01', fileName:null, fileData:null},
          'Fitness Certificate':{number:'FIT-2290', expiry:'2026-01-01', fileName:null, fileData:null},
          'Pollution Certificate':{number:'PUC-6634', expiry:'2026-02-01', fileName:null, fileData:null},
          'Permit':{number:'PRM-7712', expiry:'2026-03-01', fileName:null, fileData:null},
        }},
    ],
    drivers: [
      {id:'D1', name:'Alex', license:'DL-88213', category:'LMV', expiry:'2028-12-01', contact:'9876500001', safety:96, tripsCompleted:12, status:'Available'},
      {id:'D2', name:'John', license:'DL-44120', category:'HMV', expiry:'2025-03-01', contact:'9822000002', safety:51, tripsCompleted:8, status:'Suspended'},
      {id:'D3', name:'Priya', license:'DL-77031', category:'LMV', expiry:'2027-08-01', contact:'9911000003', safety:99, tripsCompleted:20, status:'On Trip'},
      {id:'D4', name:'Suresh', license:'DL-90045', category:'HMV', expiry:'2027-01-01', contact:'9744000004', safety:88, tripsCompleted:15, status:'Off Duty'},
    ],

      {id:'TR001', source:'Ahmedabad', destination:'Surat', vehicleId:'V2', driverId:'D3', cargoWeight:3000, distance:280, revenue:26000, status:'Dispatched', date:'2026-07-11'},
      {id:'TR002', source:'Surat', destination:'Vadodara', vehicleId:'V1', driverId:'D1', cargoWeight:400, distance:150, revenue:8000, status:'Completed', date:'2026-07-05'},
      {id:'TR003', source:'Rajkot', destination:'Bhavnagar', vehicleId:null, driverId:null, cargoWeight:600, distance:120, revenue:6000, status:'Draft', date:'2026-07-12'},
    ],

      {id:'M1', vehicleId:'V3', serviceType:'Tyre Replace', cost:6200, date:'2026-07-06', status:'Active'},
      {id:'M2', vehicleId:'V1', serviceType:'Oil Change', cost:2500, date:'2026-06-20', status:'Completed'},

    ],
    fuelLogs: [
      {id:'F1', vehicleId:'V1', date:'2026-07-05', liters:42, cost:3150},
      {id:'F2', vehicleId:'V2', date:'2026-07-06', liters:110, cost:8400},
      {id:'F3', vehicleId:'V3', date:'2026-07-06', liters:25, cost:2050},
    ],
    expenses: [
      {id:'E1', tripId:'TR001', vehicleId:'V2', toll:340, other:150},
      {id:'E2', tripId:'TR002', vehicleId:'V1', toll:120, other:0},
    ],
  };
}

let state = {
  theme:'dark',
  user:null,
  loginAttempts:0,
  locked:false,
  view:'dashboard',
  data: seed(),
  filters:{vehicleType:'All', status:'All', region:'All'},
  search:'',
  sort:{},
  toast:null,
  modal:null,
  navOpen:false,
  notifOpen:false,
  loading:false,
  confirmCtx:null,
};

function setState(patch){ Object.assign(state, patch); render(); }
function showToast(msg, type){ state.toast = {msg, type: type||'ok'}; render(); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(()=>{state.toast=null; render();}, 3200); }

function perm(section){
  if(!state.user) return 'none';
  return (RBAC[state.user.role] && RBAC[state.user.role][section]) || 'none';
}
function canEdit(section){ return perm(section) === 'edit'; }
function canSee(section){ return perm(section) !== 'none'; }

/* ---------------- helpers over data ---------------- */
function getVehicle(id){ return state.data.vehicles.find(v=>v.id===id); }
function getDriver(id){ return state.data.drivers.find(d=>d.id===id); }
function getTrip(id){ return state.data.trips.find(t=>t.id===id); }
function nonRetiredVehicles(){ return state.data.vehicles.filter(v=>v.status!=='Retired'); }
function dispatchableVehicles(){ return state.data.vehicles.filter(v=>v.status==='Available'); }
function dispatchableDrivers(){ return state.data.drivers.filter(d=>d.status==='Available' && !isExpired(d.expiry)); }

function maintenanceCostFor(vehicleId){
  return state.data.maintenance.filter(m=>m.vehicleId===vehicleId).reduce((s,m)=>s+Number(m.cost),0);
}
function fuelCostFor(vehicleId){
  return state.data.fuelLogs.filter(f=>f.vehicleId===vehicleId).reduce((s,f)=>s+Number(f.cost),0);
}
function fuelLitersFor(vehicleId){
  return state.data.fuelLogs.filter(f=>f.vehicleId===vehicleId).reduce((s,f)=>s+Number(f.liters),0);
}
function revenueFor(vehicleId){
  return state.data.trips.filter(t=>t.vehicleId===vehicleId && t.status==='Completed').reduce((s,t)=>s+Number(t.revenue||0),0);
}
function totalOperationalCost(){
  const fuel = state.data.fuelLogs.reduce((s,f)=>s+Number(f.cost),0);
  const maint = state.data.maintenance.reduce((s,m)=>s+Number(m.cost),0);
  return fuel + maint;
}
function fleetUtilization(){
  const nr = nonRetiredVehicles();
  if(nr.length===0) return 0;
  const onTrip = nr.filter(v=>v.status==='On Trip').length;
  return Math.round((onTrip/nr.length)*100);
}
function fleetFuelEfficiency(){
  const dist = state.data.trips.filter(t=>t.status==='Completed').reduce((s,t)=>s+Number(t.distance||0),0);
  const liters = state.data.fuelLogs.reduce((s,f)=>s+Number(f.liters),0);
  if(liters===0) return 0;
  return +(dist/liters).toFixed(1);
}

/* ---------------- documents & reminders ---------------- */
function docStatus(expiry){
  if(!expiry) return 'none';
  const days = daysUntil(expiry);
  if(days < 0) return 'expired';
  if(days <= 30) return 'soon';
  return 'valid';
}
function docStatusLabel(s){
  return s==='valid'?'Valid':s==='soon'?'Expiring Soon':s==='expired'?'Expired':'Not Uploaded';
}
function vehicleDocAlerts(v){
  return DOC_TYPES.map(dt=>{
    const doc = v.documents && v.documents[dt];
    if(!doc) return null;
    const st = docStatus(doc.expiry);
    if(st==='expired' || st==='soon') return {vehicle:v, docType:dt, doc, status:st, days:daysUntil(doc.expiry)};
    return null;
  }).filter(Boolean);
}
function allDocAlerts(){
  let out = [];
  state.data.vehicles.filter(v=>v.status!=='Retired').forEach(v=>{ out = out.concat(vehicleDocAlerts(v)); });
  return out;
}
function allLicenseAlerts(){
  return state.data.drivers.filter(d=> daysUntil(d.expiry) <= 30).map(d=>({driver:d, status: isExpired(d.expiry)?'expired':'soon', days:daysUntil(d.expiry)}));
}
function priorityFor(days){
  if(days < 0 || days <= 7) return 'High';
  if(days <= 15) return 'Medium';
  return 'Low';
}
function computeNotifications(){
  const notifs = [];
  allLicenseAlerts().forEach(a=>{
    notifs.push({
      type: a.status==='expired' ? 'danger' : 'warning',
      title: `Driver License ${a.status==='expired'?'Expired':'Expiring'}`,
      vehicle: null, driver: a.driver.name,
      days: a.days, priority: priorityFor(a.days),
      context:{kind:'license', driverId:a.driver.id}
    });
  });
  allDocAlerts().forEach(a=>{
    notifs.push({
      type: a.status==='expired' ? 'danger' : 'warning',
      title: `${a.docType} ${a.status==='expired'?'Expired':'Expiring'}`,
      vehicle: a.vehicle.name, driver: null,
      days: a.days, priority: priorityFor(a.days),
      context:{kind:'document', vehicleId:a.vehicle.id, docType:a.docType}
    });
  });
  notifs.sort((a,b)=>a.days-b.days);
  return notifs;
}
function toggleNotif(){ state.notifOpen = !state.notifOpen; render(); }
function closeNotif(){ state.notifOpen = false; }

/* ================= RENDER: ROOT ================= */
function render(){
  document.body.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  app.innerHTML = state.user ? renderShell() : renderLogin();
  if(state.toast){
    const t = document.createElement('div');
    t.className = 'toast ' + (state.toast.type==='err'?'err':(state.toast.type==='ok'?'ok':''));
    t.textContent = state.toast.msg;
    document.body.appendChild(t);
  }
  if(state.modal){
    const m = document.createElement('div');
    m.innerHTML = state.modal.html;
    document.body.appendChild(m.firstElementChild);
  }
}

/* ================= LOGIN ================= */
function renderLogin(){
  const err = state.locked
    ? `<div class="error-box">✕ Account locked after 5 failed attempts.<br>Wait a moment, or click "Reset attempts" below.</div>`
    : (state.loginAttempts>0 ? `<div class="error-box">✕ Invalid credentials.<br>Attempt ${state.loginAttempts} of 5.</div>` : '');
  return `
  <div class="login-wrap">
    <div class="login-side">
      <div>
        <div class="logo-mark"></div>
        <div class="brand">TransitOps</div>
        <div class="tagline">Smart Transport Operations Platform</div>
        <div class="roles-list">
          <b>One login, four roles:</b><br>
          <span class="dot"></span>Fleet Manager<br>
          <span class="dot"></span>Dispatcher<br>
          <span class="dot"></span>Safety Officer<br>
          <span class="dot"></span>Financial Analyst
        </div>
      </div>
      <div class="foot-note">TransitOps © 2026 · RBAC Enabled</div>
    </div>
    <div class="login-form-side">
      <div class="login-card">
        <h2>Sign in to your account</h2>
        <p class="sub">Enter your credentials to continue</p>
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="raven.k@transitops.in" value="raven.k@transitops.in">
        <label>Password</label>
        <input id="loginPass" type="password" placeholder="••••••••" value="demo1234">
        <label>Role (RBAC)</label>
        <select id="loginRole">
          <option>Fleet Manager</option>
          <option selected>Dispatcher</option>
          <option>Safety Officer</option>
          <option>Financial Analyst</option>
        </select>
        <div class="row-inline">
          <label style="display:flex;align-items:center;gap:8px;margin:0;text-transform:none;font-size:13px;color:var(--text-dim);">
            <input type="checkbox" checked style="width:auto;"> Remember me
          </label>
          <a href="#" onclick="return false;">Forgot password?</a>
        </div>
        <button class="btn full" ${state.locked?'disabled':''} onclick="doLogin()">Sign In</button>
        ${err}
        ${state.locked?`<button class="btn secondary full" style="margin-top:10px;" onclick="resetAttempts()">Reset attempts</button>`:''}
        <div class="hint">
          Access is scoped by role after login:<br>
          • Fleet Manager → Fleet, Maintenance, Analytics<br>
          • Dispatcher → Dashboard, Trips<br>
          • Safety Officer → Drivers, Compliance<br>
          • Financial Analyst → Fuel &amp; Expenses, Analytics<br><br>
          <i>Demo mode — any email + password (min 4 characters) signs in.</i>
        </div>
      </div>
    </div>
  </div>`;
}

function doLogin(){
  if(state.locked) return;
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const role = document.getElementById('loginRole').value;
  if(email.includes('@') && pass.length>=4){
    state.loginAttempts = 0;
    state.user = {name: email.split('@')[0].split('.').map(s=>s[0]?.toUpperCase()+s.slice(1)).join(' ') || 'Raven K.', email, role};
    state.view = 'dashboard';
    render();
  } else {
    state.loginAttempts++;
    if(state.loginAttempts>=5) state.locked = true;
    render();
  }
}
function resetAttempts(){ state.loginAttempts=0; state.locked=false; render(); }
function logout(){ state.user=null; state.view='dashboard'; state.navOpen=false; render(); }

/* ================= APP SHELL ================= */
const NAV = [
  {key:'dashboard', label:'Dashboard', section:null},
  {key:'fleet', label:'Fleet', section:'fleet'},
  {key:'drivers', label:'Drivers', section:'drivers'},
  {key:'trips', label:'Trips', section:'trips'},
  {key:'maintenance', label:'Maintenance', section:'maintenance'},
  {key:'fuel', label:'Fuel & Expenses', section:'fuel'},
  {key:'analytics', label:'Analytics', section:'analytics'},
  {key:'settings', label:'Settings', section:null},
];

function renderShell(){
  const navHtml = NAV.map(n=>{
    if(n.section && !canSee(n.section)) return '';
    const p = n.section ? perm(n.section) : null;
    return `<div class="navitem ${state.view===n.key?'active':''}" onclick="goTo('${n.key}')">
      <span>${n.label}</span>
      ${p==='view'?'<span class="navlock">VIEW</span>':''}
    </div>`;
  }).join('');

  const titles = {dashboard:'0. Dashboard', fleet:'1. Vehicle Registry', drivers:'2. Drivers & Safety Profiles',
    trips:'3. Trip Management', maintenance:'4. Maintenance', fuel:'5. Fuel & Expense Management',
    analytics:'6. Reports & Analytics', settings:'7. Settings & RBAC'};

  let body = '';
  if(state.loading){
    body = skeletonBody();
  } else if(state.view==='dashboard') body = viewDashboard();
  else if(state.view==='fleet') body = viewFleet();
  else if(state.view==='drivers') body = viewDrivers();
  else if(state.view==='trips') body = viewTrips();
  else if(state.view==='maintenance') body = viewMaintenance();
  else if(state.view==='fuel') body = viewFuel();
  else if(state.view==='analytics') body = viewAnalytics();
  else if(state.view==='settings') body = viewSettings();

  return `
  <div class="shell" onclick="if(state.notifOpen){state.notifOpen=false;render();}">
    <div class="sidebar-scrim ${state.navOpen?'open':''}" onclick="closeNav()"></div>
    <div class="sidebar ${state.navOpen?'open':''}">
      <div class="brand">TransitOps</div>
      <div class="tagline" style="padding-left:6px;margin-bottom:22px;">Smart Transport Ops</div>
      ${navHtml}
      <div class="sidebar-foot">
        <div class="navitem" onclick="logout()"><span>← Log out</span></div>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="hamburger" onclick="toggleNav()">☰</div>
        <div class="search-box">🔍 <input placeholder="Search…" value="${state.search}" oninput="onSearch(this.value)"></div>
        <div class="topbar-right">
          ${renderNotifBell()}
          <div class="theme-toggle" onclick="toggleTheme()"><div class="knob"></div></div>
          <div class="user-chip">${state.user.name}</div>
          <div class="role-badge"><div class="avatar">${ROLE_INITIALS[state.user.role]}</div><span>${state.user.role}</span></div>
        </div>
      </div>
      <div class="content">
        <div class="page-title">${titles[state.view]}</div>
        ${body}
      </div>
    </div>
  </div>`;
}

function renderNotifBell(){
  const notifs = computeNotifications();
  return `
  <div class="bell-wrap">
    <div class="bell-btn" onclick="event.stopPropagation();toggleNotif()">🔔${notifs.length? `<span class="bell-badge">${notifs.length>9?'9+':notifs.length}</span>`:''}</div>
    ${state.notifOpen? `
    <div class="notif-dropdown" onclick="event.stopPropagation()">
      <div class="notif-head"><b>Notifications</b><span class="doc-count-pill">${notifs.length} alert${notifs.length===1?'':'s'}</span></div>
      ${notifs.length? notifs.map((n,i)=>`
        <div class="notif-item" onclick="openNotifDetail(${i})">
          <div class="notif-row">
            <span class="notif-dot ${n.type}"></span>
            <span class="notif-title">${n.title}</span>
            <span class="notif-prio ${n.priority}">${n.priority}</span>
          </div>
          <div class="notif-sub">${n.vehicle? 'Vehicle: '+n.vehicle+' · ':''}${n.driver? 'Driver: '+n.driver+' · ':''}${n.days<0? Math.abs(n.days)+' day(s) overdue' : n.days+' day(s) left'}</div>
        </div>`).join('') : `<div class="notif-empty">🎉 No pending alerts. Everything is up to date.</div>`}
      ${notifs.length? `<div class="notif-foot"><button class="link-btn" onclick="goTo('dashboard');closeNotifAndRender();">View Reminder Dashboard</button></div>`:''}
    </div>`:''}
  </div>`;
}
function closeNotifAndRender(){ state.notifOpen=false; render(); }
function openNotifDetail(i){
  const notifs = computeNotifications();
  const n = notifs[i];
  if(!n) return;
  state.notifOpen = false;
  if(n.context.kind==='license'){ openEmailModal({kind:'license', driverId:n.context.driverId}); }
  else { openEmailModal({kind:'document', vehicleId:n.context.vehicleId, docType:n.context.docType}); }
}
function openEmailModal(ctx){
  let subjectDetail = '', bodyDetail = '', recipient = '';
  if(ctx.kind==='license'){
    const d = getDriver(ctx.driverId);
    subjectDetail = `Driver License Renewal — ${d.name}`;
    bodyDetail = `Your Driver License / Vehicle Document is about to expire.`;
    recipient = `${d.name.toLowerCase().replace(/\s+/g,'.')}@transitops.in`;
  } else {
    const v = getVehicle(ctx.vehicleId);
    subjectDetail = `${ctx.docType} Renewal — ${v.name}`;

function goTo(view){
  state.view = view; state.search=''; state.navOpen=false; state.loading=true; render();
  setTimeout(()=>{ state.loading=false; render(); }, 300);
}
function onSearch(v){ state.search = v; render(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; render(); }
function toggleNav(){ state.navOpen = !state.navOpen; render(); }
function closeNav(){ state.navOpen = false; render(); }

function applySort(view, rows){
  const s = state.sort[view];
  if(!s) return rows;
  return [...rows].sort((a,b)=>{
    let av=a[s.key], bv=b[s.key];
    if(typeof av==='string') av=av.toLowerCase();
    if(typeof bv==='string') bv=bv.toLowerCase();
    if(av<bv) return s.dir==='asc'?-1:1;
    if(av>bv) return s.dir==='asc'?1:-1;
    return 0;
  });
}
function sortBy(view,key){
  const cur = state.sort[view];
  if(cur && cur.key===key){ cur.dir = cur.dir==='asc'?'desc':'asc'; }
  else { state.sort[view] = {key, dir:'asc'}; }
  render();
}
function sortTh(view,key,label){
  const s = state.sort[view];
  const cls = s && s.key===key ? (s.dir==='asc'?'sort-asc':'sort-desc') : 'sortable';
  return `<th class="${cls}" onclick="sortBy('${view}','${key}')">${label}</th>`;
}
function searchFilter(rows, fields){
  if(!state.search) return rows;
  const q = state.search.toLowerCase();
  return rows.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(q)));
}

  const inMaint = v.filter(x=>x.status==='In Shop').length;

  const pendingTrips = t.filter(x=>x.status==='Draft').length;

  const recent = [...t].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,5);

    <div class="kpi green" style="cursor:pointer;" onclick="openReminderList('all')"><label>Total Alerts</label><div class="val">${totalAlerts}</div></div>

  <div class="toolbar">
    <span style="font-size:12px;color:var(--text-faint);">FILTERS</span>
    <select onchange="setFilter('vehicleType',this.value)">
      <option ${state.filters.vehicleType==='All'?'selected':''}>All</option>
      ${[...new Set(v.map(x=>x.type))].map(ty=>`<option ${state.filters.vehicleType===ty?'selected':''}>${ty}</option>`).join('')}
    </select>
    <select onchange="setFilter('status',this.value)">
      <option ${state.filters.status==='All'?'selected':''}>All</option>
      ${['Available','On Trip','In Shop','Retired'].map(s=>`<option ${state.filters.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select onchange="setFilter('region',this.value)"><option>All Regions</option></select>
  </div>
  <div class="kpi-row">
    <div class="kpi"><label>Active Vehicles</label><div class="val">${activeVehicles}</div></div>
    <div class="kpi green"><label>Available Vehicles</label><div class="val">${availableVehicles}</div></div>
    <div class="kpi orange"><label>Vehicles In Maintenance</label><div class="val">${inMaint}</div></div>
    <div class="kpi"><label>Active Trips</label><div class="val">${activeTrips}</div></div>
    <div class="kpi"><label>Pending Trips</label><div class="val">${pendingTrips}</div></div>
    <div class="kpi"><label>Drivers On Duty</label><div class="val">${onDuty}</div></div>
    <div class="kpi green"><label>Fleet Utilization</label><div class="val">${util}%</div></div>
  </div>
  <div class="grid-2">
    <div class="panel">
      <div class="panel-title">Recent Trips</div>
      <table>
        <tr><th>Trip</th><th>Vehicle</th><th>Driver</th><th>Status</th><th>Date</th></tr>
        ${recent.map(tr=>`<tr>
          <td class="mono">${tr.id}</td>
          <td>${tr.vehicleId? getVehicle(tr.vehicleId).name : '—'}</td>
          <td>${tr.driverId? getDriver(tr.driverId).name : '—'}</td>

      </table>
    </div>
    <div class="panel">
      <div class="panel-title">Vehicle Status</div>
      ${Object.entries(statusCounts).map(([k,n])=>{
        const color = k==='Available'?'var(--green)':k==='On Trip'?'var(--blue)':k==='In Shop'?'var(--orange)':'var(--red)';
        return `<div class="status-line"><span class="lbl">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${(n/maxCount)*100}%;background:${color};"></div></div><span class="n">${n}</span></div>`;
      }).join('')}
    </div>
  </div>`;
}
function setFilter(k,v){ state.filters[k]=v; render(); }

function openReminderList(kind){
  const licenseAlerts = allLicenseAlerts();
  const docAlerts = allDocAlerts();
  let items = [];
  let title = '';
  if(kind==='licenses'){ title='Expiring Licenses'; items = licenseAlerts.filter(a=>a.status==='soon').map(a=>({label:a.driver.name, sub:`License · ${a.days} day(s) left`, ctx:{kind:'license', driverId:a.driver.id}})); }
  else if(kind==='documents'){ title='Expiring Documents'; items = docAlerts.filter(a=>a.status==='soon').map(a=>({label:`${a.vehicle.name} — ${a.docType}`, sub:`${a.days} day(s) left`, ctx:{kind:'document', vehicleId:a.vehicle.id, docType:a.docType}})); }
  else if(kind==='expired'){ title='Expired Documents & Licenses';
    items = [
      ...licenseAlerts.filter(a=>a.status==='expired').map(a=>({label:a.driver.name, sub:`License · expired ${Math.abs(a.days)} day(s) ago`, ctx:{kind:'license', driverId:a.driver.id}})),
      ...docAlerts.filter(a=>a.status==='expired').map(a=>({label:`${a.vehicle.name} — ${a.docType}`, sub:`Expired ${Math.abs(a.days)} day(s) ago`, ctx:{kind:'document', vehicleId:a.vehicle.id, docType:a.docType}})),
    ];
  } else {
    title='All Alerts';
    items = [
      ...licenseAlerts.map(a=>({label:a.driver.name, sub:`License · ${a.status==='expired'?'expired '+Math.abs(a.days)+' day(s) ago':a.days+' day(s) left'}`, ctx:{kind:'license', driverId:a.driver.id}})),
      ...docAlerts.map(a=>({label:`${a.vehicle.name} — ${a.docType}`, sub:a.status==='expired'?`Expired ${Math.abs(a.days)} day(s) ago`:`${a.days} day(s) left`, ctx:{kind:'document', vehicleId:a.vehicle.id, docType:a.docType}})),
    ];
  }
  state.modal = {html:`
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:460px;max-height:80vh;overflow-y:auto;">
        <h3>${title}</h3>
        <p class="sub">${items.length} item(s) requiring attention.</p>
        ${items.length? items.map(it=>`
          <div class="doc-card" style="margin-bottom:8px;">
            <div class="doc-card-head"><b>${it.label}</b></div>
            <div class="doc-meta">${it.sub}</div>
            <div class="doc-actions"><button class="link-btn" onclick='openEmailModal(${JSON.stringify(it.ctx)})'>✉ Send Reminder</button></div>
          </div>`).join('') : `<div class="empty-state"><div class="empty-illustration">✅</div>Nothing here — all clear.</div>`}
        <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button></div>
      </div>
    </div>`};
  render();
}

/* ---------------- vehicle documents module ---------------- */
function docSummaryFor(v){
  const docs = v.documents || {};
  let valid=0, soon=0, expired=0, none=0;
  DOC_TYPES.forEach(dt=>{
    const doc = docs[dt];
    if(!doc || !doc.expiry){ none++; return; }
    const st = docStatus(doc.expiry);
    if(st==='valid') valid++; else if(st==='soon') soon++; else if(st==='expired') expired++;
  });
  return {valid, soon, expired, none, total: DOC_TYPES.length};
}
function openDocsModal(vehicleId){
  const v = getVehicle(vehicleId);
  const editable = canEdit('fleet');
  const ds = docSummaryFor(v);
  state.modal = {html:`
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="width:560px;max-height:85vh;overflow-y:auto;">
        <h3>📁 Vehicle Documents — ${v.name}</h3>
        <p class="sub">${v.regNo} · ${ds.valid}/${ds.total} documents valid<span class="doc-count-pill">${ds.expired>0?ds.expired+' expired':ds.soon>0?ds.soon+' expiring soon':'all clear'}</span></p>
        ${ds.expired>0? `<div class="banner">⚠ ${ds.expired} document(s) have expired for this vehicle. Renew immediately to avoid compliance issues.</div>`:''}
        <div class="doc-grid">
          ${DOC_TYPES.map(dt=>renderDocCard(v, dt, editable)).join('')}
        </div>
        <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Close</button></div>
      </div>
    </div>`};
  render();
}
function renderDocCard(v, docType, editable){
  const doc = (v.documents && v.documents[docType]) || {number:'', expiry:'', fileName:null, fileData:null};
  const st = docStatus(doc.expiry);
  const inputId = 'docfile_'+v.id+'_'+docType.replace(/\s+/g,'');
  return `
  <div class="doc-card">
    <div class="doc-card-head">
      <b>${docType}</b>
      <span class="doc-status ${st}">${docStatusLabel(st)}</span>
    </div>
    <div class="doc-meta">${doc.number? 'No: '+doc.number+' · ':''}Expiry: ${doc.expiry? fmtDate(doc.expiry):'—'}</div>
    <div class="doc-meta">${doc.fileName? '📎 '+doc.fileName : 'No file uploaded'}</div>
    <div class="doc-actions">
      ${doc.fileName? `<button class="link-btn" onclick="previewDoc('${v.id}','${docType}')">Preview</button>
        <button class="link-btn" onclick="downloadDoc('${v.id}','${docType}')">Download</button>`:''}
      ${editable? `
        <input type="file" id="${inputId}" style="display:none;" accept="image/*,application/pdf" onchange="handleDocUpload('${v.id}','${docType}',this)">
        <button class="link-btn" onclick="document.getElementById('${inputId}').click()">${doc.fileName?'Replace':'Upload'}</button>
        <button class="link-btn" onclick="openDocEditModal('${v.id}','${docType}')">Edit Details</button>
        ${doc.fileName? `<button class="link-btn" style="color:var(--red);" onclick="deleteDoc('${v.id}','${docType}')">Delete</button>`:''}
      `:''}
    </div>
  </div>`;
}
function handleDocUpload(vehicleId, docType, input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const v = getVehicle(vehicleId);
    if(!v.documents) v.documents = {};
    if(!v.documents[docType]) v.documents[docType] = {number:'', expiry:'', fileName:null, fileData:null};
    v.documents[docType].fileName = file.name;
    v.documents[docType].fileData = e.target.result;
    showToast(`${docType} uploaded for ${v.name}.`,'ok');
    openDocsModal(vehicleId);
  };
  reader.readAsDataURL(file);
}
function previewDoc(vehicleId, docType){
  const v = getVehicle(vehicleId);
  const doc = v.documents[docType];
  if(!doc || !doc.fileData){ showToast('No file to preview.','err'); return; }
  const w = window.open();
  if(doc.fileData.startsWith('data:image')){
    w.document.write(`<title>${docType} — ${v.name}</title><body style="margin:0;background:#111;"><img src="${doc.fileData}" style="max-width:100%;display:block;margin:0 auto;"></body>`);
  } else {
    w.location = doc.fileData;
  }
}
function downloadDoc(vehicleId, docType){
  const v = getVehicle(vehicleId);
  const doc = v.documents[docType];
  if(!doc || !doc.fileData){ showToast('No file to download.','err'); return; }
  const a = document.createElement('a');
  a.href = doc.fileData; a.download = doc.fileName || (docType+'.pdf'); a.click();
}
function deleteDoc(vehicleId, docType){
  confirmAction(`Delete the uploaded file for ${docType}? The record (number/expiry) will be kept.`, ()=>{
    const v = getVehicle(vehicleId);
    v.documents[docType].fileName = null;
    v.documents[docType].fileData = null;
    showToast(`${docType} file removed.`,'ok');
    openDocsModal(vehicleId);
  });
}
