<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TransitOps — Smart Transport Operations Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-2: #171b21;
    --border: #262b33;
    --border-soft: #1d2129;
    --text: #e7e9ec;
    --text-dim: #9aa2ad;
    --text-faint: #5b636e;
    --accent: #e08a2c;
    --accent-2: #f2a83e;
    --accent-dim: #3a2c17;
    --green: #3ecf8e;
    --green-bg: #123024;
    --blue: #4d9fec;
    --blue-bg: #10202f;
    --orange: #e0a52c;
    --orange-bg: #2f2410;
    --red: #ef5b6b;
    --red-bg: #301418;
    --radius: 10px;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"]{
    --bg: #f3f2ee;
    --panel: #ffffff;
    --panel-2: #f8f7f4;
    --border: #e2e0da;
    --border-soft: #ebe9e3;
    --text: #1c1d1f;
    --text-dim: #5c5f66;
    --text-faint: #9a9da4;
    --accent: #c96a1c;
    --accent-2: #de8330;
    --accent-dim: #f6e3cc;
    --green: #1f9d63;
    --green-bg: #e4f6ee;
    --blue: #2f6fc9;
    --blue-bg: #e6eefb;
    --orange: #b6821e;
    --orange-bg: #faf0dd;
    --red: #c8394a;
    --red-bg: #fbe7e9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;}
 
  /* ---------- LOGIN ---------- */
  .login-wrap{
    display:flex; min-height:100vh;
  }
  .login-side{
    flex:1.1; background:linear-gradient(160deg,var(--panel-2),var(--bg));
    padding:56px 48px; display:flex; flex-direction:column; justify-content:space-between;
    border-right:1px solid var(--border);
  }
  .login-form-side{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .logo-mark{
    width:44px;height:44px;border-radius:10px;
    background:repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, var(--accent-2) 4px, var(--accent-2) 8px);
    margin-bottom:18px; box-shadow:var(--shadow);
  }
  .brand{font-size:26px;font-weight:700;letter-spacing:-0.5px;}
  .tagline{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .roles-list{margin-top:40px;color:var(--text-dim);font-size:14px;line-height:2.1;}
  .roles-list b{color:var(--text);font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:10px;}
  .foot-note{color:var(--text-faint);font-size:11px;letter-spacing:.4px;text-transform:uppercase;}
 
  .login-card{width:100%;max-width:400px;}
  .login-card h2{font-size:22px;margin:0 0 4px;}
  .login-card p.sub{color:var(--text-dim);font-size:13px;margin:0 0 28px;}
  label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;margin-top:16px;font-weight:600;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:inherit; outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  input::placeholder{color:var(--text-faint);}
  .row-inline{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--text-dim);}
  .row-inline a{color:var(--accent-2);text-decoration:none;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent); color:#1a1206; border:none; font-weight:700;
    padding:12px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;
    transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn.full{width:100%;margin-top:22px;}
  .btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-weight:600;padding:8px 12px;font-size:12.5px;}
  .btn.danger{background:var(--red);color:#2a0a0e;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
  .error-box{
    margin-top:14px;background:var(--red-bg);border:1px dashed var(--red);border-radius:8px;
    padding:12px 14px;font-size:12.5px;color:var(--red);line-height:1.7;
  }
  .hint{color:var(--text-faint);font-size:11.5px;margin-top:18px;line-height:1.6;border-top:1px dashed var(--border);padding-top:14px;}
 
  /* ---------- APP SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:220px; background:var(--panel); border-right:1px solid var(--border);
    padding:22px 14px; display:flex; flex-direction:column; flex-shrink:0;
  }
  .sidebar .brand{font-size:19px;margin-bottom:2px;padding-left:6px;}
  .sidebar .tagline{font-size:11px;padding-left:6px;margin-bottom:26px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;
  }
  .navitem:hover{background:var(--panel-2);color:var(--text);}
  .navitem.active{background:var(--accent-dim);color:var(--accent-2);border-color:var(--border);font-weight:700;}
  .navitem .ic{width:16px;text-align:center;}
  .navlock{font-size:9.5px;color:var(--text-faint);margin-left:auto;border:1px solid var(--border);padding:1px 5px;border-radius:20px;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}
 
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--border);
    background:var(--bg);position:sticky;top:0;z-index:5;
  }
  .search-box{
    flex:1;max-width:340px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:9px 12px;color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:8px;
  }
  .search-box input{border:none;background:none;padding:0;font-size:13px;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;}
  .user-chip{font-size:13px;color:var(--text-dim);}
  .role-badge{
    background:var(--blue-bg);color:var(--blue);border:1px solid var(--border);
    padding:5px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#08131f;font-size:10px;
    font-weight:800;display:flex;align-items:center;justify-content:center;}
  .content{padding:24px 26px;overflow-y:auto;}
  .page-title{font-size:20px;margin:0 0 18px;display:flex;align-items:center;gap:10px;}
  .page-title .num{color:var(--text-faint);font-weight:500;}
 
  .kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:20px;}
  @media (max-width:1300px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
  .kpi{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;
    border-left:3px solid var(--blue);
  }
  .kpi.green{border-left-color:var(--green);}
  .kpi.orange{border-left-color:var(--orange);}
  .kpi label{margin:0 0 6px;font-size:10px;}
  .kpi .val{font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
 
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .panel-title{font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
  @media (max-width:1000px){.grid-2{grid-template-columns:1fr;}}
 
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
    padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;}
  th:hover{color:var(--text-dim);}
  td{padding:10px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--panel-2);}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.Available{background:var(--green-bg);color:var(--green);}
  .badge.On.Trip, .badge.OnTrip{background:var(--blue-bg);color:var(--blue);}
  .badge.In.Shop, .badge.InShop{background:var(--orange-bg);color:var(--orange);}
  .badge.Retired,.badge.Suspended,.badge.Cancelled,.badge.EXPIRED{background:var(--red-bg);color:var(--red);}
  .badge.Off.Duty,.badge.OffDuty,.badge.Draft{background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border);}
  .badge.Dispatched{background:var(--blue-bg);color:var(--blue);}
  .badge.Completed,.badge.Active-ok{background:var(--green-bg);color:var(--green);}
 
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select,.toolbar input{width:auto;min-width:120px;padding:8px 10px;font-size:12.5px;}
  .toolbar .spacer{flex:1;}
  .fieldset{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .fieldset .full{grid-column:1/-1;}
  .actions-cell{display:flex;gap:6px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
  .rule-note{font-size:11.5px;color:var(--accent-2);background:var(--accent-dim);border:1px dashed var(--accent);
    padding:9px 12px;border-radius:8px;margin-top:14px;}
  .bar-track{background:var(--panel-2);border-radius:6px;height:8px;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:6px;}
  .status-line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
  .status-line span.lbl{width:70px;flex-shrink:0;}
  .status-line span.n{width:26px;text-align:right;flex-shrink:0;color:var(--text);font-weight:600;}
  .toast{
    position:fixed;bottom:26px;right:26px;background:var(--panel);border:1px solid var(--border);
    border-left:3px solid var(--accent);padding:13px 18px;border-radius:8px;box-shadow:var(--shadow);
    font-size:13px;max-width:340px;z-index:999;animation:slidein .25s ease;
  }
  .toast.err{border-left-color:var(--red);}
  .toast.ok{border-left-color:var(--green);}
  @keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:420px;max-width:92vw;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 4px;font-size:16px;}
  .modal p.sub{color:var(--text-dim);font-size:12.5px;margin:0 0 18px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .chart-bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px;}
  .chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .chart-bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue),#2f6fc9);min-height:6px;}
  .chart-lbl{font-size:10.5px;color:var(--text-faint);}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
  .swatch{width:9px;height:9px;border-radius:2px;}
  .perm-table td, .perm-table th{text-align:center;}
  .perm-table td:first-child,.perm-table th:first-child{text-align:left;}
  .view-only-tag{font-size:11px;color:var(--text-faint);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}
  .link-btn{background:none;border:none;color:var(--accent-2);cursor:pointer;font-size:12.5px;font-weight:600;padding:0;}
  .link-btn:hover{text-decoration:underline;}
  .theme-toggle{background:var(--panel-2);border:1px solid var(--border);border-radius:20px;width:38px;height:22px;position:relative;cursor:pointer;}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:left .15s;}
  [data-theme="light"] .theme-toggle .knob{left:18px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  .banner{background:var(--orange-bg);border:1px solid var(--orange);color:var(--orange);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}
 
  /* ---------- RESPONSIVE ---------- */
  .hamburger{display:none;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;
    align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--text);font-size:16px;}
  .sidebar-scrim{display:none;}
  th.sortable::after{content:'⇅';opacity:.35;margin-left:5px;font-size:10px;}
  th.sort-asc::after{content:'↑';opacity:1;margin-left:5px;font-size:10px;color:var(--accent-2);}
  th.sort-desc::after{content:'↓';opacity:1;margin-left:5px;font-size:10px;color:var(--accent-2);}
 
  @media (max-width:980px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
 
  @media (max-width:768px){
    .hamburger{display:flex;}
    .shell{position:relative;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:150; height:100vh;
      transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-scrim.open{
      display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:140;
    }
    .topbar{padding:12px 14px;gap:10px;}
    .search-box{max-width:none;}
    .user-chip{display:none;}
    .content{padding:16px 14px;}
    .page-title{font-size:17px;margin-bottom:14px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;}
    .kpi{padding:11px 12px;}
    .kpi .val{font-size:18px;}
    .toolbar{gap:8px;}
    .toolbar select,.toolbar input{min-width:0;flex:1;}
    .fieldset{grid-template-columns:1fr;}
    .modal{width:100%;padding:18px;}
    .login-side{display:none;}
    .login-form-side{padding:20px;}
    .chart-bars{height:110px;}
    table{font-size:12px;}
    th,td{padding:8px 7px;}
    .role-badge span{display:none;}
    .role-badge{padding:5px 8px;}
  }
 
  @media (max-width:480px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .brand{font-size:17px;}
    .login-card h2{font-size:19px;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .toolbar .spacer{display:none;}
    .toolbar button{width:100%;}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions .btn{width:100%;}
  }
</style>
</head>
<body data-theme="dark">
<div id="app"></div>
 
<script>
/* =========================================================
   TransitOps — in-memory demo data layer + SPA renderer
   ========================================================= */
 
const TODAY = new Date('2026-07-12');
 
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,7).toUpperCase(); }
function fmtMoney(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function badgeClass(s){ return 'badge ' + String(s).replace(/\s+/g,'.'); }
function isExpired(dateStr){ return new Date(dateStr) < TODAY; }
function daysUntil(dateStr){ return Math.round((new Date(dateStr) - TODAY)/86400000); }
 
const RBAC = {
  'Fleet Manager':    {fleet:'edit', drivers:'edit', trips:'none', maintenance:'edit', fuel:'none', analytics:'edit'},
  'Dispatcher':       {fleet:'view', drivers:'none', trips:'edit', maintenance:'view', fuel:'none', analytics:'none'},
  'Safety Officer':   {fleet:'none', drivers:'edit', trips:'view', maintenance:'none', fuel:'none', analytics:'none'},
  'Financial Analyst':{fleet:'view', drivers:'none', trips:'none', maintenance:'none', fuel:'edit', analytics:'edit'},
};
const ROLE_INITIALS = {'Fleet Manager':'FM','Dispatcher':'DP','Safety Officer':'SO','Financial Analyst':'FA'};
 
function seed(){
  return {
    vehicles: [
      {id:'V1', regNo:'GJ01AB4562', name:'VAN-05', type:'Van', capacityKg:500, capacityLabel:'500 kg', odometer:74000, acqCost:620000, status:'Available'},
      {id:'V2', regNo:'GJ01AB9987', name:'TRUCK-11', type:'Truck', capacityKg:5000, capacityLabel:'5 Ton', odometer:182000, acqCost:2450000, status:'On Trip'},
      {id:'V3', regNo:'GJ01AB1120', name:'MINI-03', type:'Mini', capacityKg:1000, capacityLabel:'1 Ton', odometer:66000, acqCost:410000, status:'In Shop'},
      {id:'V4', regNo:'GJ01AB0081', name:'VAN-09', type:'Van', capacityKg:750, capacityLabel:'750 kg', odometer:24900, acqCost:590000, status:'Retired'},
    ],
    drivers: [
      {id:'D1', name:'Alex', license:'DL-88213', category:'LMV', expiry:'2028-12-01', contact:'9876500001', safety:96, tripsCompleted:12, status:'Available'},
      {id:'D2', name:'John', license:'DL-44120', category:'HMV', expiry:'2025-03-01', contact:'9822000002', safety:51, tripsCompleted:8, status:'Suspended'},
      {id:'D3', name:'Priya', license:'DL-77031', category:'LMV', expiry:'2027-08-01', contact:'9911000003', safety:99, tripsCompleted:20, status:'On Trip'},
      {id:'D4', name:'Suresh', license:'DL-90045', category:'HMV', expiry:'2027-01-01', contact:'9744000004', safety:88, tripsCompleted:15, status:'Off Duty'},
    ],
    trips: [
      {id:'TR001', source:'Ahmedabad', destination:'Surat', vehicleId:'V2', driverId:'D3', cargoWeight:3000, distance:280, revenue:26000, status:'Dispatched', date:'2026-07-11'},
      {id:'TR002', source:'Surat', destination:'Vadodara', vehicleId:'V1', driverId:'D1', cargoWeight:400, distance:150, revenue:8000, status:'Completed', date:'2026-07-05'},
      {id:'TR003', source:'Rajkot', destination:'Bhavnagar', vehicleId:null, driverId:null, cargoWeight:600, distance:120, revenue:6000, status:'Draft', date:'2026-07-12'},
    ],
    maintenance: [
      {id:'M1', vehicleId:'V3', serviceType:'Tyre Replace', cost:6200, date:'2026-07-06', status:'Active'},
      {id:'M2', vehicleId:'V1', serviceType:'Oil Change', cost:2500, date:'2026-06-20', status:'Completed'},
      {id:'M3', vehicleId:'V2', serviceType:'Engine Repair', cost:18000, date:'2026-05-10', status:'Completed'},
    ],
    fuelLogs: [
      {id:'F1', vehicleId:'V1', date:'2026-07-05', liters:42, cost:3150},
      {id:'F2', vehicleId:'V2', date:'2026-07-06', liters:110, cost:8400},
      {id:'F3', vehicleId:'V3', date:'2026-07-06', liters:25, cost:2050},
    ],
    expenses: [
      {id:'E1', tripId:'TR001', vehicleId:'V2', toll:340, other:150},
      {id:'E2', tripId:'TR002', vehicleId:'V1', toll:120, other:0},
    ],
  };
}
 
let state = {
  theme:'dark',
  user:null,
  loginAttempts:0,
  locked:false,
  view:'dashboard',
  data: seed(),
  filters:{vehicleType:'All', status:'All', region:'All'},
  search:'',
  sort:{},
  toast:null,
  modal:null,
  navOpen:false,
};
 
function setState(patch){ Object.assign(state, patch); render(); }
function showToast(msg, type){ state.toast = {msg, type: type||'ok'}; render(); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(()=>{state.toast=null; render();}, 3200); }
 
function perm(section){
  if(!state.user) return 'none';
  return (RBAC[state.user.role] && RBAC[state.user.role][section]) || 'none';
}
function canEdit(section){ return perm(section) === 'edit'; }
function canSee(section){ return perm(section) !== 'none'; }
 
/* ---------------- helpers over data ---------------- */
function getVehicle(id){ return state.data.vehicles.find(v=>v.id===id); }
function getDriver(id){ return state.data.drivers.find(d=>d.id===id); }
function getTrip(id){ return state.data.trips.find(t=>t.id===id); }
function nonRetiredVehicles(){ return state.data.vehicles.filter(v=>v.status!=='Retired'); }
function dispatchableVehicles(){ return state.data.vehicles.filter(v=>v.status==='Available'); }
function dispatchableDrivers(){ return state.data.drivers.filter(d=>d.status==='Available' && !isExpired(d.expiry)); }
 
function maintenanceCostFor(vehicleId){
  return state.data.maintenance.filter(m=>m.vehicleId===vehicleId).reduce((s,m)=>s+Number(m.cost),0);
}
function fuelCostFor(vehicleId){
  return state.data.fuelLogs.filter(f=>f.vehicleId===vehicleId).reduce((s,f)=>s+Number(f.cost),0);
}
function fuelLitersFor(vehicleId){
  return state.data.fuelLogs.filter(f=>f.vehicleId===vehicleId).reduce((s,f)=>s+Number(f.liters),0);
}
function revenueFor(vehicleId){
  return state.data.trips.filter(t=>t.vehicleId===vehicleId && t.status==='Completed').reduce((s,t)=>s+Number(t.revenue||0),0);
}
function totalOperationalCost(){
  const fuel = state.data.fuelLogs.reduce((s,f)=>s+Number(f.cost),0);
  const maint = state.data.maintenance.reduce((s,m)=>s+Number(m.cost),0);
  return fuel + maint;
}
function fleetUtilization(){
  const nr = nonRetiredVehicles();
  if(nr.length===0) return 0;
  const onTrip = nr.filter(v=>v.status==='On Trip').length;
  return Math.round((onTrip/nr.length)*100);
}
function fleetFuelEfficiency(){
  const dist = state.data.trips.filter(t=>t.status==='Completed').reduce((s,t)=>s+Number(t.distance||0),0);
  const liters = state.data.fuelLogs.reduce((s,f)=>s+Number(f.liters),0);
  if(liters===0) return 0;
  return +(dist/liters).toFixed(1);
}
 
/* ================= RENDER: ROOT ================= */
function render(){
  document.body.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  app.innerHTML = state.user ? renderShell() : renderLogin();
  if(state.toast){
    const t = document.createElement('div');
    t.className = 'toast ' + (state.toast.type==='err'?'err':(state.toast.type==='ok'?'ok':''));
    t.textContent = state.toast.msg;
    document.body.appendChild(t);
  }
  if(state.modal){
    const m = document.createElement('div');
    m.innerHTML = state.modal.html;
    document.body.appendChild(m.firstElementChild);
  }
}
